[mod]
id = "functionalstorage"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure drawer engine (standalone crate lib, injected as
# `crate::game::functionalstorage`).
# The content half is inside this bundle (`data/functionalstorage-content.hmod`, the built
# `content/functionalstorage.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the content and the code. The registry
# keeps one file per project, so a split port could not be listed; AE2 ships the
# same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "functionalstorage"
source = "runtime.rs"

# Game-side glue: the block entity, its container, tick, renderer and the
# interaction/drop wiring.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "functionalstorage_state"
source = "support.rs"

# A drawer gets a block entity (API 15).
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and ticks.
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# ... has one big slot (a proportional view) and a one-slot menu (API 16/17).
[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "container" },
]

# ... reconciles the view slot with the true amount each tick.
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# Clients get the stored stack for the front renderer (API 45).
[[injection]]
id = "block-entity-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "block_entity_update_tag.rs"
bindings = [
